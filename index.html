<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makoto Shinkai</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hero">
    <h1>Ram Gopal Verma</h1>
    <img src="./images/ms-gpt.png" alt="makoto-shinkai" id="mako-shin" />
  </div>
  <section id="movies">
    <h2>Movies directed</h2>
    <div class="movies-list">
      <div class="card">
        <img src="./images/wwy.jpg" alt="weathering-with-you-cover" class="movie-cover" />
        <h4 class="movie-title">Weathering with You</h4>
      </div>

      <div class="card">
        <img src="./images/tgow.jpg" alt="the-garden-of-words-cover" class="movie-cover" />
        <h4 class="movie-title">The Garden of Words</h4>
      </div>

      <div class="card">
        <img src="./images/yn.jpg" alt="your-name-cover" class="movie-cover" />
        <h4 class="movie-title">Your Name</h4>
      </div>

      <div class="card">
        <img src="./images/suzume.jpg" alt="suzume-cover" class="movie-cover" />
        <h4 class="movie-title">Suzume</h4>
      </div>
    </div>
  </section>
  <footer>
    <p>“In the evenings, before I went to sleep, and in the mornings, in the moment I woke up, I realized I was praying for rain.”</p>
  </footer>
</body>
</html>
